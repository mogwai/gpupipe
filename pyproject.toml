[build-system]
requires = ["setuptools", "wheel", "setuptools-scm", "setuptools-rust>=1.7"]
build-backend = "setuptools.build_meta"

[project]
name = "gpupipe"
dynamic = ["version"]
description = "Get the most out of your CPUs and GPUs without leaving Python: streaming multiprocessing pipelines"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Harry Coultas Blum" }]
requires-python = ">=3.10"
keywords = ["multiprocessing", "pipeline", "streaming", "gpu", "dataloader"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: Rust",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "numpy",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/mogwai/gpupipe"
Repository = "https://github.com/mogwai/gpupipe"

[project.optional-dependencies]
# PyTorch is optional: CPU pipelines run (and their workers start) without it.
# GPU stages and the tensor fast paths use it when it is installed.
torch = [
    "torch>=2.0.0",
]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "lz4>=4.0.0",
    "torch>=2.0.0",  # pipe.web serializes with torch.save
]
dev = [
    "pytest>=7.0.0",
    "pytest-xdist",
]

[tool.setuptools.packages.find]
where = ["src"]
# find() also picks up pipe._planned (preserved-but-unwired feature code, see
# PLANNED.md). Shipping it is deliberate: it is inert unless explicitly
# imported, and excluding it would break `import pipe._planned` under strict
# editable installs, which tests/test_planned_preserved.py relies on.

[[tool.setuptools-rust.ext-modules]]
# The shared-memory transport (rust/, wrapped by pipe.shmqueue / pipe.shmstore).
# Required: wheels ship it; a source build needs a Rust toolchain. Release even
# for editable installs — a debug build is ~10x slower.
target = "pipe._rustq"
path = "rust/Cargo.toml"
binding = "PyO3"
debug = false

[tool.cibuildwheel]
# CPython 3.10-3.14 plus free-threaded 3.14t: Linux (manylinux) x86_64 and
# aarch64, each on its own runner; macOS arm64 and x86_64.
# No musllinux (torch ships no musl wheels); no Windows (the extension's
# wait/wake is futex/ulock: Linux and macOS only).
build = "cp310-* cp311-* cp312-* cp313-* cp314-* cp314t-*"
skip = "*-musllinux_* *_i686"
# Torch-free smoke test of each wheel: the extension, then a CPU pipeline.
test-command = "python {project}/scripts/check_wheel.py"

[tool.cibuildwheel.linux]
before-all = "curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.macos]
# Intel wheels are cross-compiled on the Apple Silicon runner (setuptools-rust
# picks the Rust target from ARCHFLAGS) and tested under Rosetta.
archs = ["arm64", "x86_64"]
before-all = "rustup target add x86_64-apple-darwin"
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }  # Rust's minimum is above CPython's

[tool.setuptools_scm]
write_to = "src/pipe/_version.py"
# No "+g<hash>" suffix: PyPI and TestPyPI refuse local versions, and a
# TestPyPI rehearsal uploads untagged builds.
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# tests/planned/ (suites for preserved-but-unwired features, see PLANNED.md)
# is excluded via collect_ignore in tests/conftest.py — NOT via addopts
# --ignore here, because --ignore resolves relative to the invocation cwd and
# silently stops working when pytest runs from a subdirectory.

# uv-specific: Use PyTorch CUDA 13.0 index for GPU support
# [[tool.uv.index]]
# name = "pytorch-cu130"
# url = "https://download.pytorch.org/whl/cu130"
#
# [tool.uv.sources]
# torch = { index = "pytorch-cu130" }

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# E/F (pycodestyle errors, pyflakes) + I (import sorting)
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# conftest sets env/collect_ignore before imports; test_tensor gates on torch
"tests/conftest.py" = ["E402"]
"tests/test_tensor.py" = ["E402"]
# preserved-but-unwired feature code, linted when re-integrated (see PLANNED.md)
"tests/planned/*" = ["E", "F", "I"]
